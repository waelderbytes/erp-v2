# Proxy /api/auth/* -> auth-service, /api/zeitbuchung/* -> zeiterfassung-service,
# /api/* (sonst) -> erp-service. Bewusst hier im nginx statt im api-gateway
# geloest: api-gateway ist aktuell noch ein leerer Stub (siehe
# apps/api-gateway/src/app.module.ts), ein echtes Gateway mit
# Auth-Vorpruefung/Rate-Limiting ist ein spaeterer eigener Ausbauschritt (siehe
# docs/module-uebersicht.md) - fuer die erste UI reicht direktes Routing.
# WICHTIG: die spezifischeren Regeln (/api/auth, /api/zeitbuchung) muessen VOR
# der allgemeinen /api-Regel stehen, sonst matcht nginx die allgemeinere Regel
# zuerst (top-down, erster Treffer gewinnt bei prefix-Locations ohne Regex).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # WICHTIG: nur "/api" abschneiden, "/auth/..." muss erhalten bleiben - der
  # auth-service-Controller erwartet "/auth/login" etc. (siehe
  # apps/auth-service/src/modules/auth/auth.controller.ts, @Controller('auth')).
  # Fruehere Version hat faelschlich auch "/auth" mit weggeschnitten -> Backend
  # bekam nur "/login" und antwortete mit "Cannot POST /login" (08.08.2026).
  location /api/auth/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://auth-service:3000;
  }

  location /api/zeitbuchung/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://zeiterfassung-service:3000;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://erp-service:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}
