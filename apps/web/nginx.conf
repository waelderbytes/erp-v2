# Proxy /api/auth/* -> auth-service, /api/* (sonst) -> erp-service. Bewusst hier
# im nginx statt im api-gateway geloest: api-gateway ist aktuell noch ein leerer
# Stub (siehe apps/api-gateway/src/app.module.ts), ein echtes Gateway mit
# Auth-Vorpruefung/Rate-Limiting ist ein spaeterer eigener Ausbauschritt (siehe
# docs/module-uebersicht.md) - fuer die erste UI reicht direktes Routing.
# WICHTIG: /api/auth muss VOR /api stehen, sonst matcht die allgemeinere Regel
# zuerst und /api/auth/login landet faelschlich im erp-service.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/auth/ {
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://auth-service:3000;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://erp-service:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}
