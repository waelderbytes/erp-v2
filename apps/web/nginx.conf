# Proxy /api/auth/*, /api/benutzer*, /api/rollen* -> auth-service,
# /api/zeitbuchung/* -> zeiterfassung-service, /api/* (sonst) -> erp-service.
# Bewusst hier im nginx statt im api-gateway geloest: api-gateway ist aktuell
# noch ein leerer Stub (siehe apps/api-gateway/src/app.module.ts), ein echtes
# Gateway mit Auth-Vorpruefung/Rate-Limiting ist ein spaeterer eigener
# Ausbauschritt (siehe docs/module-uebersicht.md) - fuer die erste UI reicht
# direktes Routing.
# HINWEIS zur Reihenfolge: bei mehreren passenden PRAEFIX-Locations (kein
# Regex) waehlt nginx automatisch die LAENGSTE passende - die Reihenfolge im
# File ist also nicht entscheidend, wird hier trotzdem von spezifisch nach
# allgemein sortiert, damit es beim Lesen nachvollziehbar bleibt.
# WICHTIG: /api/benutzer und /api/rollen bewusst OHNE abschliessenden Slash
# in der Location definiert (anders als /api/auth/ und /api/zeitbuchung/) -
# GET/POST /benutzer und GET /rollen werden ohne weiteren Pfad-Teil
# aufgerufen (Basis-Collection-Endpoints). Eine Location "/api/benutzer/" MIT
# Slash matcht die exakte Anfrage "/api/benutzer" (ohne Slash) NICHT - die
# waere dann faelschlich an die allgemeine /api/-Regel (erp-service)
# durchgereicht worden.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # WICHTIG: nur "/api" abschneiden, "/auth/..." muss erhalten bleiben - der
  # auth-service-Controller erwartet "/auth/login" etc. (siehe
  # apps/auth-service/src/modules/auth/auth.controller.ts, @Controller('auth')).
  # Fruehere Version hat faelschlich auch "/auth" mit weggeschnitten -> Backend
  # bekam nur "/login" und antwortete mit "Cannot POST /login" (08.08.2026).
  location /api/auth/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://auth-service:3000;
  }

  location /api/zeitbuchung/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://zeiterfassung-service:3000;
  }

  # Kein Slash am Ende - siehe Kommentar oben (Basis-Collection-Endpoints ohne
  # weiteren Pfad-Teil, z.B. exaktes "GET /api/benutzer").
  location /api/benutzer {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://auth-service:3000;
  }

  location /api/rollen {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://auth-service:3000;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://erp-service:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}
