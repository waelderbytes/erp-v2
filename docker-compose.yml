# docker-compose.yml - Tenant-Deployment (1 Stack pro Tenant auf gemeinsamem Host)
# Siehe docs/architecture.md Abschnitt 8 (Hosting-Strategie): mehrere Tenant-Stacks
# laufen nebeneinander auf demselben vServer, jeder mit eigener .env / eigenen
# benannten Volumes / eigener Tenant-DB, alle ueber Traefik geroutet.
#
# Reverse Proxy (Traefik) wird NICHT hier, sondern in einem separaten, einmaligen
# infra-compose.yml auf dem Host betrieben (kommt mit dem ersten echten Deployment) -
# hier nur die Tenant-eigenen Services, referenzieren das externe Traefik-Netzwerk.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-erp_tenant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  auth-service:
    build: ./apps/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:3001:3000"

  erp-service:
    build: ./apps/erp-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      # Siehe common/filters/all-exceptions.filter.ts: bei unerwarteten
      # Fehlern kommt Fehlermeldung+Stacktrace direkt in der HTTP-Antwort
      # mit statt nur "Internal server error". Default 'true', da dies der
      # Testserver ist - bei echten Kunden-Deployments in deren .env auf
      # 'false' setzen (DEBUG_ERRORS=false), sonst DSGVO-relevantes Leck.
      DEBUG_ERRORS: ${DEBUG_ERRORS:-true}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:3002:3000"

  zeiterfassung-service:
    build: ./apps/zeiterfassung-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      - postgres
      - auth-service
    ports:
      - "127.0.0.1:3003:3000"

  api-gateway:
    build: ./apps/api-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:3000
      ERP_SERVICE_URL: http://erp-service:3000
    depends_on:
      - auth-service
      - erp-service
    ports:
      - "127.0.0.1:3000:3000"
    # KEIN Traefik-Label: api-gateway ist aktuell noch ein leerer Stub (siehe
    # apps/api-gateway/src/app.module.ts). /api/* wird bis auf Weiteres von nginx
    # IM web-Container direkt an auth-service/erp-service durchgereicht (siehe
    # apps/web/nginx.conf) - eine zusaetzliche Traefik-Route hierher wuerde /api/*
    # faelschlich an den leeren Stub umleiten, sobald ein echtes Gateway gebaut
    # ist, hier die Labels aus docker-compose.yml.dist/Git-History reaktivieren.

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.web-${INSTANCE_ID:-inst001}.rule=Host(`${INSTANCE_HOST:-inst001.waelderbytes.de}`)"
      - "traefik.http.routers.web-${INSTANCE_ID:-inst001}.entrypoints=websecure"
      - "traefik.http.routers.web-${INSTANCE_ID:-inst001}.tls.certresolver=le"
      - "traefik.http.services.web-${INSTANCE_ID:-inst001}.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  default:
    name: erp_${INSTANCE_ID:-inst001}
  traefik_public:
    external: true
